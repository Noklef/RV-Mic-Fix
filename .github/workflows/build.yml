name: Build mod

on:
  push:
    branches: ['**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Windows x64
    runs-on: windows-2022
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install pinned formatter
        run: |
          python -m pip install --disable-pip-version-check --only-binary=:all: clang-format==19.1.5
          if ($LASTEXITCODE -ne 0) { throw 'Formatter installation failed.' }
          $formatterDirectory = python -c "import pathlib, clang_format; print(pathlib.Path(clang_format.__file__).parent / 'data' / 'bin')"
          if ($LASTEXITCODE -ne 0) { throw 'Formatter path lookup failed.' }
          Add-Content -LiteralPath $env:GITHUB_PATH -Value $formatterDirectory -Encoding utf8

      - name: Check, build, test, and package
        run: ./scripts/Build-Package.ps1

      - name: Upload installable ZIP
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: out/dist/RVVoiceFix-0.3.0-test.zip
          archive: false
          if-no-files-found: error
          retention-days: 14
